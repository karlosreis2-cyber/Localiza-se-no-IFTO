<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meu App Maps — Navegação</title>
  <meta name="application-name" content="Meu App" />
  <meta name="apple-mobile-web-app-title" content="Meu App" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14532d" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --verde: #15803d;
      --verde-escuro: #14532d;
      --azul: #1d4ed8;
      --vermelho: #dc2626;
      --borda: #e2e8f0;
      --texto: #0f172a;
      --subtexto: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100dvh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--texto);
      overflow: hidden;
      background: #0b1120;
    }

    #app { display: flex; width: 100%; height: 100dvh; position: relative; }
    #map { flex: 1; width: 100%; height: 100%; z-index: 1; background: #0b1120; }

    .device-switcher {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.92);
      padding: 3px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }
    .device-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .device-btn.active { background: #22c55e; color: #052e16; }

    /* Modo Celular */
    body.mode-mobile #sidebar {
      position: fixed; top: 0; left: 0; right: 0; width: 100%;
      pointer-events: none; z-index: 1000;
      display: flex; flex-direction: column; padding: 10px 12px; gap: 8px;
    }
    body.mode-mobile .header {
      pointer-events: auto; background: rgba(20, 83, 45, 0.95);
      backdrop-filter: blur(8px); border-radius: 12px; padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    body.mode-mobile .header h1 { font-size: 0.92rem; }
    body.mode-mobile .header p, body.mode-mobile #statusBar { display: none; }
    body.mode-mobile .origin-section, body.mode-mobile .search-section {
      pointer-events: auto; background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px); border-radius: 12px; padding: 10px 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
    }
    body.mode-mobile #searchResults { max-height: 44dvh; }
    body.mode-mobile #routeCard {
      position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 1100;
      background: #fff; border: 2px solid #3b82f6; pointer-events: auto;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    /* Modo Computador */
    body.mode-desktop #sidebar {
      width: 400px; max-width: 92vw; height: 100dvh; background: #fff;
      border-right: 1px solid var(--borda); display: flex; flex-direction: column; z-index: 1000;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.35);
    }

    .header {
      background: linear-gradient(135deg, var(--verde-escuro), var(--verde));
      color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .header h1 { font-size: 1.02rem; font-weight: 700; }
    .header p { font-size: 0.75rem; opacity: 0.92; margin-top: 2px; }

    .section { padding: 12px 16px; border-bottom: 1px solid var(--borda); }
    .label-title {
      font-size: 0.74rem; font-weight: 700; text-transform: uppercase;
      color: var(--subtexto); margin-bottom: 6px; display: flex; justify-content: space-between;
    }

    .search-row { display: flex; gap: 6px; align-items: center; }
    .search-wrapper { position: relative; flex: 1; }
    #searchInput {
      width: 100%; padding: 10px 34px 10px 12px; border: 2px solid #cbd5e1;
      border-radius: 9px; font-size: 0.93rem; outline: none; background: #fff;
    }
    #searchInput:focus { border-color: var(--verde); }
    #clearSearchBtn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      border: none; background: #e2e8f0; color: #334155; width: 22px; height: 22px;
      border-radius: 50%; cursor: pointer; font-weight: bold; display: none;
    }
    #btnToggleList {
      padding: 10px 11px; border: 1px solid #cbd5e1; border-radius: 9px;
      background: #f8fafc; font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    body.mode-desktop #btnToggleList { display: none; }

    #searchResults {
      max-height: 300px; overflow-y: auto; border: 1px solid var(--borda);
      border-radius: 9px; margin-top: 8px; background: #fff; display: none;
    }
    body.mode-desktop #searchResults { display: block; flex: 1; }

    .result-item { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
    .result-item:hover { background: #f0fdf4; }
    .result-name { font-size: 0.88rem; font-weight: 600; }
    .result-meta { font-size: 0.75rem; color: var(--subtexto); margin-top: 2px; }

    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn {
      flex: 1; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px;
      background: #fff; font-size: 0.82rem; font-weight: 600; cursor: pointer; text-align: center;
    }
    .btn-blue { background: var(--azul); color: #fff; border-color: var(--azul); }
    .btn-danger { background: #fef2f2; color: var(--vermelho); border-color: #fecaca; }
    .btn.active-pick { background: #fef3c7; border-color: #f59e0b; color: #92400e; }

    #routeCard {
      display: none; background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 12px; padding: 12px 14px; margin-top: 10px;
    }
    .route-stats { display: flex; gap: 14px; margin: 8px 0; font-size: 0.86rem; font-weight: 700; color: #1d4ed8; }
    #statusBar { padding: 10px 16px; font-size: 0.78rem; color: var(--subtexto); margin-top: auto; background: #f8fafc; }

    .pulse-origin {
      width: 18px; height: 18px; background: #3b82f6; border: 3px solid #fff;
      border-radius: 50%; box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.45);
    }
    .pulse-dest {
      width: 22px; height: 22px; background: #ef4444; border: 3px solid #fff;
      border-radius: 50%; box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.45);
      animation: pulseRed 1.5s infinite;
    }
    @keyframes pulseRed {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.75); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body class="mode-mobile">
  <div id="app">
    <aside id="sidebar">
      <div class="header">
        <div>
          <h1>Meu App Maps</h1>
          <p>Navegação Satélite • PWA</p>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button type="button" class="device-btn active" id="btnOpenQr" style="background:#fff; color:#14532d;">📲 QR</button>
          <div class="device-switcher">
            <button type="button" class="device-btn active" id="btnModeMobile">📱 Celular</button>
            <button type="button" class="device-btn" id="btnModeDesktop">💻 PC</button>
          </div>
        </div>
      </div>

      <div class="section origin-section">
        <div class="label-title">
          <span>📍 Minha Localização</span>
          <span id="locSourceBadge" style="color:#1d4ed8;">Entrada Principal</span>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-blue" id="btnUseGps">📡 Meu GPS</button>
          <button type="button" class="btn" id="btnPickOrigin">🖱️ Marcar no mapa</button>
        </div>
      </div>

      <div class="section search-section" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <div class="label-title">
          <span>🔍 Buscar Local</span>
          <span id="pointsCounter">0 pontos</span>
        </div>
        <div class="search-row">
          <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Pesquisar local, bloco, setor..." autocomplete="off" />
            <button type="button" id="clearSearchBtn">✕</button>
          </div>
          <button type="button" id="btnToggleList">📋 Lista</button>
        </div>
        <div id="searchResults"></div>

        <div id="routeCard">
          <h3 id="destTitle" style="font-size:0.94rem; color:#1e3a8a;">Destino</h3>
          <div id="destMeta" style="font-size:0.78rem; color:#334155;"></div>
          <div class="route-stats">
            <span id="routeDist">📏 0 m</span>
            <span id="routeTime">🚶 ~0 min</span>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-blue" id="btnRouteQr">🔗 Link &amp; QR</button>
            <button type="button" class="btn" id="btnExternalMaps">🧭 Google Maps</button>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-danger" id="btnResetView">Mostrar todos os pontos</button>
          </div>
        </div>
      </div>

      <div id="statusBar">Aplicativo pronto.</div>
    </aside>

    <main id="map"></main>
  </div>

  <!-- Modal Link & QR Code -->
  <div id="qrModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.78); z-index:2500; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:16px; max-width:380px; width:100%; padding:18px; text-align:center;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="font-size:1rem; color:#14532d;">📲 Link &amp; QR Code</strong>
        <button type="button" id="btnCloseQr" style="border:none; background:#e2e8f0; width:30px; height:30px; border-radius:50%; cursor:pointer; font-weight:bold;">✕</button>
      </div>
      <p id="qrDestLabel" style="font-size:0.82rem; color:#475569; margin-bottom:10px;">Acesso Geral</p>
      <img id="qrImg" alt="QR Code" style="width:200px; height:200px; border:2px solid #e2e8f0; border-radius:12px; padding:8px; margin-bottom:10px;" />
      <input type="text" id="navLinkInput" readonly style="width:100%; padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:0.78rem; margin-bottom:10px;" />
      <button type="button" class="btn btn-blue" id="btnCopyLink" style="width:100%;">📋 Copiar Link</button>
    </div>
  </div>

  <!-- Banner de Instalação PWA -->
  <div id="installAppBanner" style="display:none; position:fixed; bottom:14px; left:12px; right:12px; z-index:2200; background:#14532d; color:#fff; border-radius:14px; padding:12px 14px; box-shadow:0 12px 28px rgba(0,0,0,0.45); border:1px solid #22c55e; align-items:center; justify-content:space-between; gap:10px;">
    <div style="font-size:0.82rem;">
      <strong>📲 Instalar Aplicativo</strong><br/>
      <span id="installAppHint" style="color:#dcfce7; font-size:0.75rem;">Adicione à tela inicial do celular.</span>
    </div>
    <div style="display:flex; gap:6px;">
      <button type="button" id="btnInstallApp" style="border:none; background:#22c55e; color:#052e16; font-weight:700; font-size:0.78rem; padding:8px 12px; border-radius:9px; cursor:pointer;">Instalar</button>
      <button type="button" id="btnDismissInstall" style="border:none; background:rgba(255,255,255,0.18); color:#fff; font-weight:700; font-size:0.78rem; padding:8px 10px; border-radius:9px; cursor:pointer;">✕</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const LOCAIS = [
      { id: 'P1', nome: 'Entrada Principal', setor: 'Acesso', lat: -10.197876, lng: -48.312089 },
      { id: 'P2', nome: 'Biblioteca Central', setor: 'Ensino', lat: -10.198096, lng: -48.312186 },
      { id: 'P3', nome: 'Auditório Principal', setor: 'Eventos', lat: -10.199543, lng: -48.312436 },
      { id: 'P4', nome: 'Ginásio Poliesportivo', setor: 'Esportes', lat: -10.199590, lng: -48.310721 },
      { id: 'P5', nome: 'Refeitório', setor: 'Alimentação', lat: -10.198558, lng: -48.313033 }
    ];

    const CENTER = [-10.1990, -48.3118];
    let userLatLng = L.latLng(LOCAIS[0].lat, LOCAIS[0].lng);
    let selectedDest = null;
    let pickingOrigin = false;

    const map = L.map('map', { center: CENTER, zoom: 17, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    }).addTo(map);

    const layerPoints = L.layerGroup().addTo(map);
    const layerRoute = L.layerGroup().addTo(map);

    const originMarker = L.marker(userLatLng, {
      icon: L.divIcon({ className: '', html: '<div class="pulse-origin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
      draggable: true
    }).addTo(map).bindPopup('<strong>📍 Minha Localização</strong>');

    originMarker.on('dragend', (e) => {
      userLatLng = e.target.getLatLng();
      document.getElementById('locSourceBadge').textContent = 'Ajustado';
      if (selectedDest) traceRoute(selectedDest);
    });

    function haversine(a, b) {
      const R = 6371000, rad = (d) => d * Math.PI / 180;
      const dLat = rad(b.lat - a.lat), dLon = rad(b.lng - a.lng);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function traceRoute(pt) {
      selectedDest = pt;
      layerRoute.clearLayers();
      const destLatLng = L.latLng(pt.lat, pt.lng);
      L.polyline([userLatLng, destLatLng], { color: '#fff', weight: 8, opacity: 0.9 }).addTo(layerRoute);
      L.polyline([userLatLng, destLatLng], { color: '#00e5ff', weight: 5, dashArray: '10, 6' }).addTo(layerRoute);
      L.marker(destLatLng, {
        icon: L.divIcon({ className: '', html: '<div class="pulse-dest"></div>', iconSize: [22, 22], iconAnchor: [11, 11] })
      }).addTo(layerRoute).bindPopup(`<strong>🎯 ${pt.nome}</strong>`).openPopup();

      const dist = Math.round(haversine(userLatLng, destLatLng));
      document.getElementById('destTitle').textContent = `🎯 ${pt.nome}`;
      document.getElementById('destMeta').textContent = `Setor: ${pt.setor}`;
      document.getElementById('routeDist').textContent = `📏 ${dist} m`;
      document.getElementById('routeTime').textContent = `🚶 ~${Math.max(1, Math.round(dist / 75))} min`;
      document.getElementById('routeCard').style.display = 'block';
      map.fitBounds(L.latLngBounds([userLatLng, destLatLng]), { padding: [70, 70] });
    }

    function renderList(q = '') {
      const list = document.getElementById('searchResults');
      const filtered = LOCAIS.filter(p => `${p.nome} ${p.setor}`.toLowerCase().includes(q.toLowerCase()));
      list.innerHTML = '';
      filtered.forEach(pt => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `<div class="result-name">${pt.nome}</div><div class="result-meta">${pt.setor}</div>`;
        item.onclick = () => {
          document.getElementById('searchInput').value = pt.nome;
          document.getElementById('clearSearchBtn').style.display = 'block';
          if (document.body.classList.contains('mode-mobile')) list.style.display = 'none';
          traceRoute(pt);
        };
        list.appendChild(item);
      });
    }

    LOCAIS.forEach(pt => {
      L.circleMarker([pt.lat, pt.lng], { radius: 6, fillColor: '#22c55e', color: '#fff', weight: 2, fillOpacity: 0.95 })
        .addTo(layerPoints)
        .bindTooltip(pt.nome)
        .on('click', () => traceRoute(pt));
    });

    document.getElementById('pointsCounter').textContent = `${LOCAIS.length} pontos`;
    renderList();

    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('focus', () => {
      renderList(searchInput.value);
      searchResults.style.display = 'block';
    });
    searchInput.addEventListener('input', () => {
      clearSearchBtn.style.display = searchInput.value ? 'block' : 'none';
      renderList(searchInput.value);
      searchResults.style.display = 'block';
    });
    document.getElementById('btnToggleList').onclick = () => {
      const open = searchResults.style.display === 'block';
      if (!open) renderList(searchInput.value);
      searchResults.style.display = open ? 'none' : 'block';
    };
    function resetAll() {
      selectedDest = null;
      layerRoute.clearLayers();
      document.getElementById('routeCard').style.display = 'none';
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      if (document.body.classList.contains('mode-mobile')) searchResults.style.display = 'none';
      else renderList();
    }
    clearSearchBtn.onclick = resetAll;
    document.getElementById('btnResetView').onclick = resetAll;

    document.getElementById('btnUseGps').onclick = () => {
      navigator.geolocation?.getCurrentPosition((pos) => {
        userLatLng = L.latLng(pos.coords.latitude, pos.coords.longitude);
        originMarker.setLatLng(userLatLng);
        document.getElementById('locSourceBadge').textContent = 'GPS Ativo';
        if (selectedDest) traceRoute(selectedDest); else map.setView(userLatLng, 18);
      });
    };

    const btnPickOrigin = document.getElementById('btnPickOrigin');
    btnPickOrigin.onclick = () => {
      pickingOrigin = !pickingOrigin;
      btnPickOrigin.classList.toggle('active-pick', pickingOrigin);
      map.getContainer().style.cursor = pickingOrigin ? 'crosshair' : '';
    };
    map.on('click', (e) => {
      if (!pickingOrigin) return;
      userLatLng = e.latlng;
      originMarker.setLatLng(userLatLng);
      pickingOrigin = false;
      btnPickOrigin.classList.remove('active-pick');
      map.getContainer().style.cursor = '';
      document.getElementById('locSourceBadge').textContent = 'Marcado no mapa';
      if (selectedDest) traceRoute(selectedDest);
    });

    document.getElementById('btnExternalMaps').onclick = () => {
      if (!selectedDest) return;
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${selectedDest.lat},${selectedDest.lng}&travelmode=walking`, '_blank');
    };

    // QR Code Modal
    function openQr() {
      const url = new URL(window.location.href.split('?')[0]);
      if (selectedDest) url.searchParams.set('destino', selectedDest.id);
      const link = url.toString();
      document.getElementById('qrDestLabel').textContent = selectedDest ? `Destino: ${selectedDest.nome}` : 'Acesso Geral ao App';
      document.getElementById('navLinkInput').value = link;
      document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(link)}`;
      document.getElementById('qrModal').style.display = 'flex';
    }
    document.getElementById('btnOpenQr').onclick = openQr;
    document.getElementById('btnRouteQr').onclick = openQr;
    document.getElementById('btnCloseQr').onclick = () => document.getElementById('qrModal').style.display = 'none';
    document.getElementById('btnCopyLink').onclick = () => {
      const inp = document.getElementById('navLinkInput');
      inp.select();
      navigator.clipboard?.writeText(inp.value);
      document.getElementById('btnCopyLink').textContent = '✅ Link Copiado!';
      setTimeout(() => document.getElementById('btnCopyLink').textContent = '📋 Copiar Link', 2000);
    };

    // Seletor Celular / PC
    document.getElementById('btnModeMobile').onclick = () => {
      document.body.className = 'mode-mobile';
      document.getElementById('btnModeMobile').classList.add('active');
      document.getElementById('btnModeDesktop').classList.remove('active');
      searchResults.style.display = 'none';
      setTimeout(() => map.invalidateSize(), 150);
    };
    document.getElementById('btnModeDesktop').onclick = () => {
      document.body.className = 'mode-desktop';
      document.getElementById('btnModeDesktop').classList.add('active');
      document.getElementById('btnModeMobile').classList.remove('active');
      renderList();
      setTimeout(() => map.invalidateSize(), 150);
    };

    // Abrir destino direto via ?destino=ID
    const destParam = new URLSearchParams(window.location.search).get('destino');
    if (destParam) {
      const found = LOCAIS.find(p => p.id.toLowerCase() === destParam.toLowerCase());
      if (found) traceRoute(found);
    }

    // Service Worker + Instalação PWA
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
    let deferredPrompt = null;
    const installBanner = document.getElementById('installAppBanner');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIos && !window.navigator.standalone && location.protocol.startsWith('http')) {
      document.getElementById('installAppHint').innerHTML = 'No Safari, toque em <strong>Compartilhar</strong> e <strong>"Adicionar à Tela de Início"</strong>.';
      document.getElementById('btnInstallApp').textContent = 'Entendi';
      installBanner.style.display = 'flex';
    }
    document.getElementById('btnInstallApp').onclick = async () => {
      if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
      installBanner.style.display = 'none';
    };
    document.getElementById('btnDismissInstall').onclick = () => installBanner.style.display = 'none';
  </script>
</body>
</html>
